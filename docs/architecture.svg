<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="Georgia, 'Source Serif 4', serif">
  <style>
    .bg     { fill: #0c0b09; }
    .ink    { fill: #131210; }
    .fg     { fill: #f5ecd6; }
    .dim    { fill: #b8ad95; }
    .muted  { fill: #807866; }
    .gold   { fill: #d4b882; stroke: #d4b882; }
    .verify { fill: #8ba76a; stroke: #8ba76a; }
    .encrypt{ fill: #e8a847; stroke: #e8a847; }

    .zone-title { font-style: italic; font-weight: 400; font-size: 22px; fill: #f5ecd6; }
    .label      { font-family: 'Helvetica Neue', 'Inter Tight', sans-serif; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; fill: #807866; }
    .box-title  { font-family: 'Helvetica Neue', 'Inter Tight', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: #f5ecd6; }
    .mono       { font-family: 'JetBrains Mono', 'Menlo', monospace; font-size: 11px; fill: #b8ad95; }
    .mono-gold  { font-family: 'JetBrains Mono', 'Menlo', monospace; font-size: 11px; fill: #d4b882; }
    .arrow-label{ font-family: 'Helvetica Neue', 'Inter Tight', sans-serif; font-size: 11px; letter-spacing: 0.08em; fill: #d4b882; }
    .verify-label{ font-family: 'Helvetica Neue', 'Inter Tight', sans-serif; font-size: 11px; letter-spacing: 0.08em; fill: #8ba76a; }
    .box        { fill: #131210; stroke: rgba(212,184,130,0.32); stroke-width: 1; }
    .enclave    { fill: rgba(212,184,130,0.04); stroke: #d4b882; stroke-width: 2; stroke-dasharray: 6 4; }
    .arrow      { fill: none; stroke: #d4b882; stroke-width: 1.5; }
    .arrow-verify { fill: none; stroke: #8ba76a; stroke-width: 1.5; }
    .arrow-chain  { fill: none; stroke: #d4b882; stroke-width: 1.2; stroke-dasharray: 2 4; opacity: 0.6; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d4b882"/>
    </marker>
    <marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8ba76a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1080"/>

  <!-- title -->
  <text x="800" y="50" text-anchor="middle" class="zone-title" style="font-size:28px">Vienna — verifiable Diplomacy on EigenCompute</text>
  <line x1="600" y1="68" x2="1000" y2="68" stroke="#d4b882" stroke-width="1" opacity="0.4"/>
  <text x="800" y="90" text-anchor="middle" class="label">trust moves from the operator to the silicon + the published commit</text>

  <!-- =========== TOP ZONE — Browser =========== -->
  <text x="120" y="148" class="label">I · Player's Browser</text>

  <!-- browser window -->
  <rect class="box" x="600" y="140" width="400" height="160" rx="2"/>
  <rect x="600" y="140" width="400" height="22" fill="rgba(212,184,130,0.06)"/>
  <circle cx="612" cy="151" r="3" fill="#807866"/>
  <circle cx="624" cy="151" r="3" fill="#807866"/>
  <circle cx="636" cy="151" r="3" fill="#807866"/>
  <text x="800" y="156" text-anchor="middle" class="mono" style="font-size:10px">vienna.eigencompute.xyz</text>

  <text x="800" y="190" text-anchor="middle" class="box-title">Order entry · live</text>
  <text x="800" y="210" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">click unit → mode picker → click destination</text>
  <text x="800" y="240" text-anchor="middle" class="mono-gold">A PAR — BUR</text>
  <text x="800" y="258" text-anchor="middle" class="mono-gold">A MAR S A PAR — BUR</text>
  <text x="800" y="282" text-anchor="middle" class="verify-label">✓ in-browser signature verification</text>

  <!-- =========== ENCLAVE ZONE =========== -->
  <text x="120" y="372" class="label">II · Intel TDX Enclave · EigenCompute</text>

  <rect class="enclave" x="180" y="360" width="1240" height="380" rx="4"/>
  <rect x="220" y="346" width="160" height="28" fill="#0c0b09"/>
  <text x="300" y="365" text-anchor="middle" class="arrow-label">attested boundary</text>

  <!-- intel chip badge -->
  <rect x="1320" y="380" width="80" height="32" class="box" stroke="#d4b882"/>
  <text x="1360" y="392" text-anchor="middle" class="label" style="font-size:9px">tdx quote</text>
  <text x="1360" y="404" text-anchor="middle" class="mono-gold" style="font-size:9px">Intel-signed</text>

  <!-- four interior boxes -->
  <!-- FastAPI server -->
  <rect class="box" x="240" y="430" width="240" height="120" rx="2"/>
  <text x="360" y="458" text-anchor="middle" class="box-title">FastAPI server</text>
  <line x1="280" y1="468" x2="440" y2="468" stroke="rgba(212,184,130,0.18)"/>
  <text x="360" y="488" text-anchor="middle" class="mono">/games</text>
  <text x="360" y="506" text-anchor="middle" class="mono">/games/:id/orders</text>
  <text x="360" y="524" text-anchor="middle" class="mono">/games/:id/resolve</text>
  <text x="360" y="542" text-anchor="middle" class="mono">/attestation · /verify</text>

  <!-- engine -->
  <rect class="box" x="560" y="430" width="280" height="120" rx="2"/>
  <text x="700" y="458" text-anchor="middle" class="box-title">diplomacy / diplomacy</text>
  <text x="700" y="476" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">wrapped, not forked</text>
  <line x1="600" y1="488" x2="800" y2="488" stroke="rgba(212,184,130,0.18)"/>
  <text x="700" y="506" text-anchor="middle" class="mono">DATC-compliant adjudicator</text>
  <text x="700" y="524" text-anchor="middle" class="mono">(CICERO research engine)</text>
  <text x="700" y="542" text-anchor="middle" class="mono-gold">pip install diplomacy</text>

  <!-- signing key -->
  <rect class="box" x="920" y="430" width="280" height="120" rx="2"/>
  <text x="1060" y="458" text-anchor="middle" class="box-title">Enclave signing key</text>
  <text x="1060" y="476" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">generated in-enclave at boot</text>
  <line x1="960" y1="488" x2="1160" y2="488" stroke="rgba(212,184,130,0.18)"/>
  <text x="1060" y="506" text-anchor="middle" class="mono">Ed25519 · signing</text>
  <text x="1060" y="524" text-anchor="middle" class="mono">Curve25519 · sealed-box</text>
  <text x="1060" y="542" text-anchor="middle" class="mono-gold">private half never leaves</text>

  <!-- AI seat -->
  <rect class="box" x="240" y="600" width="500" height="110" rx="2"/>
  <text x="490" y="628" text-anchor="middle" class="box-title">Claude AI seats · paid via x402</text>
  <text x="490" y="646" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">player-signed persona fingerprint folded into every turn signature</text>
  <line x1="320" y1="658" x2="660" y2="658" stroke="rgba(212,184,130,0.18)"/>
  <text x="490" y="678" text-anchor="middle" class="mono">aggression · loyalty · opening · notes</text>
  <text x="490" y="696" text-anchor="middle" class="mono-gold">USDC deposit · ~$0.02 per turn</text>

  <!-- signed turn delta -->
  <rect class="box" x="820" y="600" width="380" height="110" rx="2" stroke="#d4b882" stroke-width="1.5"/>
  <text x="1010" y="628" text-anchor="middle" class="box-title">Signed turn delta</text>
  <line x1="880" y1="640" x2="1140" y2="640" stroke="rgba(212,184,130,0.18)"/>
  <text x="1010" y="660" text-anchor="middle" class="mono">{ phase_from, phase_to,</text>
  <text x="1010" y="676" text-anchor="middle" class="mono">  orders_revealed, new_state_hash,</text>
  <text x="1010" y="692" text-anchor="middle" class="mono-gold">  signature · image_digest }</text>

  <!-- arrows browser -> server -->
  <path class="arrow" d="M 740 300 Q 600 360 480 430" marker-end="url(#ah)"/>
  <text x="540" y="370" class="arrow-label">🔒 sealed orders (Curve25519)</text>

  <!-- arrows enclave flow -->
  <path class="arrow" d="M 480 490 L 560 490" marker-end="url(#ah)"/>
  <path class="arrow" d="M 840 490 L 920 490" marker-end="url(#ah)"/>
  <path class="arrow" d="M 1060 550 L 1010 600" marker-end="url(#ah)"/>
  <path class="arrow" d="M 700 550 Q 720 580 800 605" marker-end="url(#ah)"/>
  <path class="arrow" d="M 490 600 L 490 560" marker-end="url(#ah)"/>
  <text x="495" y="580" class="mono-gold" style="font-size:10px">↑ orders</text>

  <!-- signed delta back to browser for in-browser verify -->
  <path class="arrow-verify" d="M 1010 600 Q 1300 400 900 300" marker-end="url(#ah-v)"/>
  <text x="1180" y="380" class="verify-label">signed delta + pubkey</text>
  <text x="1180" y="395" class="verify-label">→ browser verifies, locally</text>

  <!-- tdx quote out -->
  <path class="arrow-chain" d="M 1360 380 L 1360 320" marker-end="url(#ah)"/>
  <text x="1380" y="345" class="arrow-label">→ Intel CA chain</text>

  <!-- =========== PUBLIC ZONE =========== -->
  <text x="120" y="800" class="label">III · Public, anyone-can-verify</text>

  <!-- GitHub source -->
  <rect class="box" x="240" y="820" width="280" height="120" rx="2"/>
  <text x="380" y="850" text-anchor="middle" class="box-title">GitHub source</text>
  <text x="380" y="868" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">github.com/.../vienna</text>
  <line x1="280" y1="880" x2="480" y2="880" stroke="rgba(212,184,130,0.18)"/>
  <text x="380" y="898" text-anchor="middle" class="mono">commit b77b04d…</text>
  <text x="380" y="916" text-anchor="middle" class="mono">AGPL-3.0</text>
  <text x="380" y="934" text-anchor="middle" class="mono-gold">$ git clone → docker build</text>

  <!-- image digest -->
  <rect class="box" x="560" y="820" width="280" height="120" rx="2"/>
  <text x="700" y="850" text-anchor="middle" class="box-title">Reproducible image</text>
  <text x="700" y="868" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">verifiable build</text>
  <line x1="600" y1="880" x2="800" y2="880" stroke="rgba(212,184,130,0.18)"/>
  <text x="700" y="900" text-anchor="middle" class="mono-gold" style="font-size:10px">sha256:6c74b494…65674f1b</text>
  <text x="700" y="918" text-anchor="middle" class="mono">EigenCompute build sandbox</text>
  <text x="700" y="934" text-anchor="middle" class="mono">+ provenance signature</text>

  <!-- on-chain escrow -->
  <rect class="box" x="880" y="820" width="280" height="120" rx="2"/>
  <text x="1020" y="850" text-anchor="middle" class="box-title">On-chain escrow</text>
  <text x="1020" y="868" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">sepolia · EigenLayer-backed</text>
  <line x1="920" y1="880" x2="1120" y2="880" stroke="rgba(212,184,130,0.18)"/>
  <text x="1020" y="900" text-anchor="middle" class="mono">recovers ed25519 pubkey,</text>
  <text x="1020" y="918" text-anchor="middle" class="mono">pays winner attestation,</text>
  <text x="1020" y="934" text-anchor="middle" class="mono-gold">no admin in the loop</text>

  <!-- vienna-verify CLI -->
  <rect class="box" x="1200" y="820" width="200" height="120" rx="2" stroke="#8ba76a" stroke-dasharray="0"/>
  <text x="1300" y="850" text-anchor="middle" class="box-title" fill="#8ba76a">vienna-verify CLI</text>
  <text x="1300" y="868" text-anchor="middle" class="dim" style="font-size:11px;font-style:italic">local · in your terminal</text>
  <line x1="1220" y1="880" x2="1380" y2="880" stroke="rgba(139,167,106,0.32)"/>
  <text x="1300" y="900" text-anchor="middle" class="verify-label">1 image digest</text>
  <text x="1300" y="916" text-anchor="middle" class="verify-label">2 enclave pubkey</text>
  <text x="1300" y="932" text-anchor="middle" class="verify-label">3 Ed25519 signature</text>

  <!-- verifiable build chain arrows (dotted) -->
  <path class="arrow-chain" d="M 520 880 L 560 880" marker-end="url(#ah)"/>
  <path class="arrow-chain" d="M 700 820 L 700 720 Q 700 700 920 660" marker-end="url(#ah)"/>
  <text x="710" y="745" class="arrow-label" style="font-size:10px">verifiable build chain</text>

  <!-- escrow trigger -->
  <path class="arrow" d="M 1020 720 Q 1020 770 1020 820" marker-end="url(#ah)"/>
  <text x="1040" y="775" class="arrow-label" style="font-size:10px">game-end winner attestation</text>

  <!-- cli verify chain -->
  <path class="arrow-verify" d="M 1300 820 Q 1300 760 1300 720" stroke-dasharray="2 4"/>
  <path class="arrow-verify" d="M 1300 720 L 1200 660" marker-end="url(#ah-v)"/>
  <text x="1320" y="770" class="verify-label" style="font-size:10px">reads /verify · /attestation · /turns/:n</text>

  <!-- footer caption -->
  <line x1="180" y1="990" x2="1420" y2="990" stroke="rgba(212,184,130,0.18)"/>
  <text x="800" y="1015" text-anchor="middle" class="dim" style="font-size:13px;font-style:italic">
    Orders are sealed in the browser, decrypted only inside the attested enclave.
  </text>
  <text x="800" y="1038" text-anchor="middle" class="dim" style="font-size:13px;font-style:italic">
    Every turn is signed by a key that exists only in a binary verifiable against the public commit.
  </text>
  <text x="800" y="1062" text-anchor="middle" class="dim" style="font-size:13px;font-style:italic">
    Any player can re-derive the trust chain locally — without re-trusting the server.
  </text>
</svg>
